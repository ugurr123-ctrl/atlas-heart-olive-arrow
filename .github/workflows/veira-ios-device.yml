name: Veira iPhone archive
on:
  push:
    branches: [veira-local-privacy-release]
    paths: ['.github/workflows/veira-ios-device.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node prepare.mjs
      - run: npx --no-install cap add ios --packagemanager SPM
      - name: Set Veira icon
        run: |
          icons=ios/App/App/Assets.xcassets/AppIcon.appiconset
          sips -s format jpeg -z 1024 1024 www/apple-touch-icon.png --out "$RUNNER_TEMP/veira-icon.jpg"
          sips -s format png "$RUNNER_TEMP/veira-icon.jpg" --out "$icons/Veira.png"
          printf '%s\n' '{"images":[{"filename":"Veira.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$icons/Contents.json"
      - name: Archive iPhone release without signing
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/Veira.xcarchive" PRODUCT_BUNDLE_IDENTIFIER=life.veira.app MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=1 CODE_SIGNING_ALLOWED=NO archive
          app=Veira.xcarchive/Products/Applications/App.app
          test -f "$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = life.veira.app
          file "$app/App"
          ditto -c -k --keepParent Veira.xcarchive Veira-iPhone-Unsigned-Archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Veira-iPhone-Unsigned-Archive
          path: mobile/Veira-iPhone-Unsigned-Archive.zip
          if-no-files-found: error
